<div class="tab-mess-detail">
  <div class="chat-container" *ngFor="let user of userReceiverInfo">
    <!-- Phần header -->
    <div class="chat-header" >
      <div class="header-avatar">
      <img src="{{user.avatar}}" alt="Avatar">
      </div>
      <div class="header-info">
        <div class="user-name">{{user.username}}</div>
        <div class="status">Đang hoạt động</div>
      </div>
    </div>

    <!-- Phần danh sách tin nhắn -->
    <div class="message-list" #chatContainer>
      <div *ngFor="let message of messages" class="message"
        [ngClass]="{ 'right': message.senderId === senderId, 'left': message.senderId !== senderId }">
        <div *ngIf="message.senderId !== senderId" class="avatar">
          <img src="{{user.avatar}}" alt="Avatar">
        </div>
        <div class="message-bubble">
          {{ message.content }}
        </div>
      </div>
    </div>

    <!-- Phần nhập tin nhắn -->
    <div class="message-input">
      <input type="text" placeholder="Nhập tin nhắn..." [(ngModel)]="newMessage" #messageInput
        (keyup.enter)="sendMessage()" />
      <button (click)="sendMessage()">Gửi</button>
    </div>
  </div>
</div>
