<div class="container py-3 ">
  <!-- Edit Profile -->
  <div class="card mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>Edit Profile</span>
      <div class="d-flex gap-2">
        <button class="btn btn-primary" (click)="saveForm()" [disabled]="profileForm.invalid">
          <i class="bi bi-save"></i> Save
        </button>
        <button class="btn btn-secondary" (click)="resetForm()">
          <i class="bi bi-arrow-clockwise"></i> Reset
        </button>
      </div>
    </div>
    <div class="card-body">
      <form [formGroup]="profileForm">
        <div class="mb-3">
          <label for="fullname" class="form-label"><i class="bi bi-person-vcard icon"></i> Full Name</label>
          <input type="text" class="form-control" id="fullname" formControlName="fullname"
            placeholder="Enter your name" />
        </div>

        <div class="mb-3">
          <label for="dob" class="form-label"><i class="bi bi-cake icon"></i>
            Birthday</label>
          <input type="date" class="form-control" id="dob" formControlName="dob" placeholder="Your Birthday" />
        </div>

        <div class="mb-3">
          <label for="linksocial" class="form-label"><i class="bi bi-link-45deg icon"></i> LinkSocial</label>
          <input type="text" class="form-control" id="linksocial" formControlName="linksocial"
            placeholder="Enter your website link" />
        </div>

        <div class="mb-3">
          <label for="love-song" class="form-label"><i class="bi bi-music-note icon"></i> Love Song</label>
          <input type="text" class="form-control" id="love-song" formControlName="lovesong"
            placeholder="Your favorite song" />
        </div>

        <div class="mb-3">
          <label for="education" class="form-label"><i class="bi bi-mortarboard icon"></i> Education</label>
          <input type="text" class="form-control" id="education" formControlName="education"
            placeholder="Enter your education" />
        </div>
        <div class="mb-3">
          <label for="address" class="form-label"><i class="bi bi-geo-alt icon"></i> Address</label>
          <input type="text" class="form-control" id="address" formControlName="address"
            placeholder="Enter your address" />
        </div>

      </form>
    </div>
  </div>

  <!-- Edit Account!-->
  <div class="card">
    <form [formGroup]="editPasswordForm" (ngSubmit)="SaveNewPassword()">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>Edit Account</span>
        <button type="submit" class="btn btn-primary" [disabled]="editPasswordForm.invalid">
          <i class="bi bi-save"></i> Save
        </button>
      </div>
      <div class="card-body">
        <div class="form-group mb-3">
          <p class="section-header"><i class="bi bi-person-circle icon"></i>
            Account: {{nameAccount}}</p>
          <input type="text" id="username" name="username" class="form-control visually-hidden" value
            autocomplete="username" readonly />
        </div>
        <div class="form-group mb-3">
          <label for="current-password" class="form-label">
            <i class="bi bi-lock icon"></i> Current Password
          </label>
          <input type="password" id="current-password" formControlName="currentPassword" class="form-control"
            placeholder="Current password" autocomplete="new-password" />
          <div
            *ngIf="editPasswordForm.get('currentPassword')?.invalid && editPasswordForm.get('currentPassword')?.touched"
            class="text-danger">
            Current password is required.
          </div>
        </div>
        <div class="form-group mb-3">
          <label for="new-password" class="form-label">
            <i class="bi bi-lock icon"></i> New Password
          </label>
          <input type="password" id="new-password" formControlName="newPassword" class="form-control"
            placeholder="New password" autocomplete="new-password" />
          <div *ngIf="editPasswordForm.get('newPassword')?.invalid && editPasswordForm.get('newPassword')?.touched"
            class="text-danger">
            New password must be at least 6 characters long.
          </div>
        </div>
        <div class="form-group mb-3">
          <label for="confirm-password" class="form-label">
            <i class="bi bi-lock-fill icon"></i> Confirm Password
          </label>
          <input type="password" id="confirm-password" formControlName="confirmPassword" class="form-control"
            placeholder="Confirm New password" autocomplete="new-password" />
          <div
            *ngIf="editPasswordForm.get('confirmPassword')?.invalid && editPasswordForm.get('confirmPassword')?.touched"
            class="text-danger">
            Confirm password is required.
          </div>
          <div *ngIf="editPasswordForm.hasError('passwordMismatch')" class="text-danger">
            Passwords do not match.
          </div>
        </div>
      </div>
    </form>
  </div>

</div>
