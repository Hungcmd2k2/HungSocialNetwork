<div class="Post">
  <form (ngSubmit)="onSubmit()" #postForm="ngForm">
    <!-- Post Content -->
    <div class="mb-3">
      <label for="content" class="form-label">Post Content</label>
      <textarea
        type="text"
        id="content"
        class="form-control"
        rows="5"
        name="content"
        [(ngModel)]="post.content"
        required
      ></textarea>
    </div>
    <!-- File Attachment -->
    <div class="mb-3">
      <label for="file" class="form-label">File Attachment</label>
      <input
        type="file"
        id="file"
        class="form-control"
        (change)="onFileSelected($event)"
        multiple
      />
      <div class="mt-3">
        <!-- Preview hình ảnh -->
        <div class="file-previews">
          <div
            *ngFor="let preview of previews; let i = index"
            class="file-preview"
          >
            <img [src]="preview" alt="Preview Image" class="preview-img" />
          </div>
        </div>
      </div>
    </div>
    <!-- Privacy Options -->
    <div class="mb-3">
      <label for="privacy" class="form-label">Privacy</label>
      <select
        id="privacy"
        class="form-select"
        name="privacy"
        [(ngModel)]="post.privacy"
        required
      >
        <option value="Public">Public</option>
        <option value="Private">Private</option>
        <option value="Follower">Follower</option>
      </select>
    </div>
    <!-- Additional Options -->
    <div class="mb-3">
      <label for="tags" class="form-label">Tags</label>
      <input
        type="text"
        id="tags"
        class="form-control"
        placeholder="Enter tags, separated by commas"
        [(ngModel)]="post.tags"
        name="tags"
      />
    </div>
    <!-- Submit Button -->
    <button type="submit" class="btn btn-primary" [disabled]="!postForm.valid">
      Post
    </button>
    <ngx-spinner
      class="icon_search_user"
      name="post_loading"
      bdColor="transparent"
      size="medium"
      color="#2596be"
      type="ball-clip-rotate-pulse"
      [fullScreen]="false"
    ></ngx-spinner>
  </form>
</div>
