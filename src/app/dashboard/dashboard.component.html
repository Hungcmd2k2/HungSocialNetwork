<div class="container" (childEvent)="setTitle('Personal-profile')">
  <div class="container_sub">
    <div class="left">
      <div class="content">
        <div class="content_top">
          <div class="div_logo">
            <div class="div_logo_image">
              <img
                src="assets/images/HomePage/logo_HungSocial.png"
                alt="logo web"
              />
            </div>
            <p>HungSocial</p>
          </div>
        </div>
        <div class="content_mid">
          <div class="content_mid_sub">
            <button
              type="button"
              class="btn btn-outline-secondary"
              [routerLink]="['/Dashboard/Home']"
              routerLinkActive="active"
              routerLinkActive="active"
              (click)="setTitle('Home')"
            >
              <i class="bi bi-house"></i>
              Home
            </button>
            <button
              type="button"
              class="btn btn-outline-secondary"
              [routerLink]="['/Dashboard/Creat-Post']"
              routerLinkActive="active"
              routerLinkActive="active"
              (click)="setTitle('New post')"
            >
              <i class="bi bi-patch-plus"></i>
              Post
            </button>

            <button
              type="button"
              class="btn btn-outline-secondary"
              [routerLink]="['/Dashboard/Message']"
              routerLinkActive="active"
              (click)="setTitle('Message')"
            >
              <i class="bi bi-chat"></i>
              Message
            </button>
            <button
              type="button"
              class="btn btn-outline-secondary"
              [routerLink]="['/Dashboard/Notification']"
              routerLinkActive="active"
              (click)="setTitle('Notification')"
            >
              <i class="bi bi-bell"></i>
              Notification
            </button>
            <button
              type="button"
              class="btn btn-outline-secondary"
              [routerLink]="['/Dashboard/Profile']"
              routerLinkActive="active"
              (click)="setTitle('Profile')"
            >
              <i class="bi bi-person"></i>
              Profile
            </button>
            <button
              type="button"
              class="btn btn-outline-secondary"
              [routerLink]="['/Dashboard/Friend']"
              routerLinkActive="active"
              (click)="setTitle('Friend')"
            >
              <i class="bi bi-people"></i>
              Friend
            </button>
            <button
              type="button"
              class="btn btn-outline-secondary"
              [routerLink]="['/Dashboard/Setting']"
              routerLinkActive="active"
              (click)="setTitle('Setting')"
            >
              <i class="bi bi-gear"></i>
              Setting
            </button>
          </div>
        </div>

        <div class="content_bottom">
          <button
            type="button"
            class="btn btn-outline-secondary"
            (click)="logout()"
          >
            <i class="bi bi-box-arrow-left"></i>
            Logout
          </button>
        </div>
      </div>
    </div>
    <div class="middle">
      <div class="header">
        <div class="tilePage">
          <p id="TilePage">{{ title }}</p>
        </div>
        <div class="reload" style="cursor: pointer;">
          <i (click)="reloadCurrentPage()"  class="bi bi-arrow-clockwise" style="font-size: 24px"></i>
        </div>
      </div>

      <div class="Content_Change">
        <!-----router oulet-->
        <router-outlet></router-outlet>
        <router-outlet name="message"></router-outlet>
        <!---end router oulet-->
      </div>
    </div>
    <div class="right">
      <div class="input_search">
        <div class="input-group">
          <input
            type="text"
            class="form-control"
            placeholder="Search for users"
            [(ngModel)]="searchQuery"
            (keyup)="onSearch()"
          />
        </div>
      </div>
      <div class="result_search_user">
        <ngx-spinner
          class="icon_search_user"
          name="search_user"
          bdColor="transparent"
          size="medium"
          color="#2596be"
          type="ball-clip-rotate-pulse"
          [fullScreen]="false"
        ></ngx-spinner>
        <!-- Kết quả tìm kiếm -->
        <div *ngIf="listUser && listUser.length > 0" class="list-group mt-3">
          <div *ngFor="let user of listUser" class="list-group-item" (click)="onUserClick(user)">
            <div class="container">
              <div class="profile-container">
                <!-- Profile Image -->
                <div class="profile-image">
                  <img src={{user.avatar}} alt="Profile Picture">
                </div>
                <!-- Profile Info -->
                <div class="profile-info">
                  <span class="name">{{user.username}}</span>
                  <span class="verified">{{user.fullname}}</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Hiển thị "Not Found" nếu không có kết quả và đã có từ khóa tìm kiếm -->
        <div
          *ngIf="listUser.length === 0 && searchQuery.trim() !== ''"
          class="mt-3 text-center"
        >
          <strong>Not Found</strong>
        </div>
        <!-- Một phần của giao diện có spinner nhỏ -->
        <ngx-spinner
          name="load_1"
          bdColor="rgba(0, 0, 0, 0.8)"
          size="medium"
          color="#fff"
          type="ball-spin-fade"
          [fullScreen]="false"
          ><p style="color: white">Loading...</p></ngx-spinner
        >
      </div>
    </div>
  </div>

</div>
