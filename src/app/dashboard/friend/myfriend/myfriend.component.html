<div class="content">
  <div class="messages-list" *ngFor="let user of listDetail">
    <div class="message-item" (click)="goMessDetail(user.userid)">
      <img src="{{user.avatar}}" alt="User Avatar" loading="lazy" width="200" height="200" class="message-avatar">
      <div class="message-info">
        <span class="message-username">{{user.username}}</span>
        <span class="message-time">{{user.address}}</span>
      </div>
    </div>
  </div>
</div>
