<div class="d-flex justify-content-center align-items-center min-vh-100">
  <div class="container">
    <div class="row">
      <!-- Cột bên trái: Thông tin đăng nhập -->
      <div class="col-md-6 d-flex flex-column justify-content-center border-left-column">
        <h2 class="mb-4 text-center">Login</h2>
        <form [formGroup]="loginForm" (ngSubmit)="onLogin()" >
          <div class="form-group mb-3">
            <input type="text" formControlName="email"  id="username" class="form-control" placeholder=" Email" autocomplete="username">
            <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
              <small *ngIf="loginForm.get('email')?.errors?.['required']">Email is required.</small>
              <small *ngIf="loginForm.get('email')?.errors?.['email']">Invalid email format.</small>
            </div>
          </div>
          <div class="form-group mb-3" style="position: relative;">
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              id="password"
              class="form-control"
              placeholder="Password"
              autocomplete="new-password"
            />
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none;"
            >
              <i [ngClass]="showPassword ? 'bi bi-eye' : 'bi bi-eye-slash'"></i>
            </button>
          </div>
          <!-- Nút submit thu nhỏ và căn giữa -->
          <div class="d-flex justify-content-center">
            <button [disabled]="loginForm.invalid" type="submit" class="btn custom-login-btn " >Login</button>
          </div>
        </form>
        <div class="text-center mt-3">
          <span>You don't have an account? </span>
          <a [routerLink]="['/Registration']" class="text-primary" style="text-decoration: none;">Registration</a>
        </div>
      </div>

      <!-- Cột bên phải: Hình ảnh -->
      <div class="col-md-6 d-none d-md-block">
        <img [src]="randomImage" class="img-fluid" alt="Login Image">
      </div>
    </div>
  </div>
</div>
